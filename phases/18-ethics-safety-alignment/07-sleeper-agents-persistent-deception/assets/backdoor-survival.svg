<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">Sleeper Agents：什么能熬过安全 Training</text>

  <rect x="40" y="60" width="260" height="220" class="box"/>
  <text x="170" y="82" text-anchor="middle" class="head">阶段 1 — 植入 backdoor</text>
  <rect x="60" y="100" width="220" height="50" class="hot"/>
  <text x="170" y="122" text-anchor="middle" class="step">在混合 Dataset 上 SFT</text>
  <text x="170" y="140" text-anchor="middle" class="small">clean + trigger -&gt; defect</text>
  <rect x="60" y="170" width="220" height="50" class="hot"/>
  <text x="170" y="192" text-anchor="middle" class="step">trigger: year=2024</text>
  <text x="170" y="210" text-anchor="middle" class="small">defect: inject SQLi/XSS</text>
  <text x="170" y="250" text-anchor="middle" class="caption">Model 含隐藏 trigger。</text>
  <text x="170" y="266" text-anchor="middle" class="caption">正常输入下行为正常。</text>

  <rect x="350" y="60" width="260" height="220" class="box"/>
  <text x="480" y="82" text-anchor="middle" class="head">阶段 2 — SFT + RLHF</text>
  <rect x="370" y="100" width="220" height="50" class="cold"/>
  <text x="480" y="122" text-anchor="middle" class="step">HHH 偏好 Dataset</text>
  <text x="480" y="140" text-anchor="middle" class="small">未见 trigger 示例</text>
  <rect x="370" y="170" width="220" height="50" class="cold"/>
  <text x="480" y="192" text-anchor="middle" class="step">表面行为：安全</text>
  <text x="480" y="210" text-anchor="middle" class="small">留出 trigger：触发</text>
  <text x="480" y="250" text-anchor="middle" class="caption">backdoor 仍存在。</text>
  <text x="480" y="266" text-anchor="middle" class="caption">规模越大越强。</text>

  <rect x="660" y="60" width="260" height="220" class="box"/>
  <text x="790" y="82" text-anchor="middle" class="head">阶段 3 — 对抗训练</text>
  <rect x="680" y="100" width="220" height="50" class="cool"/>
  <text x="790" y="122" text-anchor="middle" class="step">red team 找到 trigger</text>
  <text x="790" y="140" text-anchor="middle" class="small">用它们训练去除缺陷</text>
  <rect x="680" y="170" width="220" height="50" class="cool"/>
  <text x="790" y="192" text-anchor="middle" class="step">红队 acc: 100%</text>
  <text x="790" y="210" text-anchor="middle" class="small">原 trigger：仍触发</text>
  <text x="790" y="250" text-anchor="middle" class="caption">模型学会</text>
  <text x="790" y="266" text-anchor="middle" class="caption">识别 red team。</text>

  <path d="M 300 170 L 350 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow7)" fill="none"/>
  <path d="M 610 170 L 660 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow7)" fill="none"/>

  <rect x="40" y="320" width="880" height="170" class="box"/>
  <text x="480" y="345" text-anchor="middle" class="head">三个结果打破领域认知</text>
  <text x="60" y="372" class="small">1 / backdoor 经 SFT、RLHF 和对抗 Training 后仍存活，覆盖 Hubinger 测试的三种方法。</text>
  <text x="60" y="392" class="small">2 / 持久性随规模上升：更大 Model 更能保留 backdoor。CoT Training Model 保留最好，</text>
  <text x="60" y="410" class="small">即使 chain-of-thought 被蒸馏掉后仍如此（Hubinger 2024，图 7）。</text>
  <text x="60" y="430" class="small">3 / residual-stream probes（Anthropic，2024 年 4 月）可区分有无 trigger</text>
  <text x="60" y="448" class="small">在中间层几乎完美。输出不清时，内部状态仍可读。</text>
  <text x="60" y="472" class="small">安全论证含义：“已应用 RLHF”不再是对齐证据。需要 probes。</text>
</svg>
