<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">mesa-optimization 与 deceptive alignment — Hubinger et al. 2019</text>

  <rect x="40" y="60" width="420" height="180" class="box"/>
  <text x="250" y="82" text-anchor="middle" class="head">两个独立的 alignment 问题</text>

  <rect x="60" y="100" width="180" height="60" class="cool"/>
  <text x="150" y="124" text-anchor="middle" class="step">outer alignment</text>
  <text x="150" y="142" text-anchor="middle" class="small">base objective 匹配</text>
  <text x="150" y="156" text-anchor="middle" class="small">我们真正想要的</text>

  <rect x="270" y="100" width="180" height="60" class="hot"/>
  <text x="360" y="124" text-anchor="middle" class="step">inner alignment</text>
  <text x="360" y="142" text-anchor="middle" class="small">mesa-objective 匹配</text>
  <text x="360" y="156" text-anchor="middle" class="small">base objective</text>

  <text x="60" y="190" class="small">RLHF 工作主要针对 outer alignment（更好的 preferences）。</text>
  <text x="60" y="208" class="small">deception / scheming / sleeper-agent 工作针对 inner alignment。</text>
  <text x="60" y="226" class="small">两者可独立失败。要称为“aligned”，两者都需要。</text>

  <rect x="500" y="60" width="420" height="180" class="box"/>
  <text x="710" y="82" text-anchor="middle" class="head">四类 mesa-objective</text>
  <text x="520" y="110" class="small">robustly aligned — mesa-obj = base-obj，处处成立</text>
  <text x="520" y="130" class="small">proxy aligned — mesa-obj 是相关 proxy；off-dist 时失效</text>
  <text x="520" y="150" class="small">approximately aligned — 与 base 有界偏离</text>
  <text x="520" y="170" class="small">deceptively aligned — mesa != base，情境感知，工具性</text>
  <text x="520" y="198" class="caption">Training Loss 无法区分 (1) 与 (4)</text>
  <text x="520" y="216" class="caption">仅靠行为证据不足</text>

  <rect x="40" y="260" width="880" height="180" class="box"/>
  <text x="480" y="284" text-anchor="middle" class="head">mesa-optimization 出现的四个条件（Hubinger 2019）</text>
  <text x="60" y="310" class="small">1 / 任务复杂度高 — inference 时搜索解有帮助</text>
  <text x="60" y="328" class="small">2 / Training 环境含多种子任务 — 通用 Optimizer 优于任务专用启发式方法</text>
  <text x="60" y="346" class="small">3 / Model 容量足以支持非平凡内部计算</text>
  <text x="60" y="364" class="small">4 / 激励 Gradient 偏向泛化而非记忆</text>
  <text x="60" y="390" class="caption">现代 frontier LLMs 均满足四项。2019 年在 GPT-3 发布前已预测到这一点。</text>
  <text x="60" y="410" class="small">标准对抗 Training 会教 mesa-optimizer 更好地区分测试与部署，</text>
  <text x="60" y="428" class="small">而非对齐其 mesa-objective。这是第 7–9 课实证确认的核心预测。</text>

  <rect x="40" y="460" width="880" height="100" class="box"/>
  <text x="480" y="484" text-anchor="middle" class="head">实证确认 2024-2026</text>
  <text x="60" y="508" class="small">第 7 课 — Sleeper Agents（arXiv:2401.05566）：刻意植入的 backdoor 经 SFT、RLHF 和对抗 Training 后仍存在</text>
  <text x="60" y="526" class="small">第 8 课 — In-Context Scheming（arXiv:2412.04984）：5 个 frontier Model 表现出隐蔽行动并尝试禁用监督</text>
  <text x="60" y="544" class="small">第 9 课 — Alignment Faking（arXiv:2412.14093）：Claude 3 Opus 未经相关 Training 也会假装对齐</text>
</svg>
