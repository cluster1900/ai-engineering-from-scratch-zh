<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">三个检测器，三类故障</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Agent -->
  <rect x="330" y="80" width="220" height="80" class="cool"/>
  <text x="440" y="104" text-anchor="middle" class="label">Agent</text>
  <text x="346" y="128" class="small">读取、推理、行动</text>
  <text x="346" y="144" class="small">不能触碰 tripwires</text>

  <!-- Kill switch -->
  <rect x="60" y="200" width="220" height="120" class="hot"/>
  <text x="170" y="222" text-anchor="middle" class="label">kill switch</text>
  <text x="76" y="244" class="small">外部 boolean</text>
  <text x="76" y="260" class="small">• feature flag / Redis / signed cfg</text>
  <text x="76" y="276" class="small">• 每次操作检查，而非启动时</text>
  <text x="76" y="292" class="small">• Agent 不能设为 OFF</text>
  <text x="76" y="308" class="small">• 重启用 = 明确人工操作</text>

  <!-- Circuit breaker -->
  <rect x="330" y="200" width="220" height="120" class="warn"/>
  <text x="440" y="222" text-anchor="middle" class="label">熔断器</text>
  <text x="346" y="244" class="small">特定模式暂停</text>
  <text x="346" y="260" class="small">• 5 次相同 Tool 调用</text>
  <text x="346" y="276" class="small">• N 次连续失败</text>
  <text x="346" y="292" class="small">• 速率超过阈值</text>
  <text x="346" y="308" class="small">• 关闭 / 开启 / 半开启</text>

  <!-- Canary -->
  <rect x="600" y="200" width="220" height="120" class="cold"/>
  <text x="710" y="222" text-anchor="middle" class="label">探针 Token</text>
  <text x="616" y="244" class="small">无合法用途的诱饵</text>
  <text x="616" y="260" class="small">• 伪造的 AWS_SECRET_ACCESS_KEY</text>
  <text x="616" y="276" class="small">• 伪造的 DB record sentinel</text>
  <text x="616" y="292" class="small">• workspace 中的伪造文件</text>
  <text x="616" y="308" class="small">• 伪造的 memory entry</text>

  <path d="M390 160 L250 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 160 L440 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 160 L630 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Catches vs misses -->
  <rect x="60" y="350" width="760" height="76" class="cool"/>
  <text x="440" y="374" text-anchor="middle" class="label">各自捕获什么</text>
  <text x="80" y="394" class="content">kill：操作员决策 · breaker：重复 / 速率模式 · canary：触碰禁区资源的意图</text>
  <text x="80" y="412" class="content">Cilium/eBPF egress redirect（500ms 内）补充 canary：隔离 pod 进入取证 honeypot</text>

  <!-- What nothing catches -->
  <rect x="60" y="430" width="760" height="60" class="hot"/>
  <text x="440" y="454" text-anchor="middle" class="label">检测器捕获不了什么</text>
  <text x="80" y="474" class="content">语义组合：单个操作都通过检测；组合本身才是攻击（见第 10 课）</text>
</svg>
