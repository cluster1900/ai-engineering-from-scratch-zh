<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">RSP v2（2023）→ v3.0（2026年2月24日）：变化</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Two columns: additions / removals -->
  <rect x="60" y="80" width="370" height="280" class="cool"/>
  <text x="245" y="104" text-anchor="middle" class="label">v3.0 新增</text>
  <text x="76" y="126" class="content">• 双层缓解时间表</text>
  <text x="76" y="142" class="small">（Anthropic 单方面 vs 行业建议）</text>
  <text x="76" y="162" class="content">• AI R&amp;D-4 阈值（研究自动化）</text>
  <text x="76" y="178" class="small">一旦越过：发布 affirmative case</text>
  <text x="76" y="198" class="content">• Frontier Safety Roadmap（常设文档）</text>
  <text x="76" y="214" class="content">• Risk Report（常设文档，回顾性）</text>
  <text x="76" y="234" class="content">• 引用 RAND SL-4 安全</text>
  <text x="76" y="250" class="small">（在行业建议层）</text>
  <text x="76" y="270" class="content">• 承认：“有把握排除</text>
  <text x="76" y="286" class="content">AI R&amp;D-4 正变得困难”</text>
  <text x="76" y="318" class="small">v3.0 公告指出该阈值是当前关注点</text>
  <text x="76" y="334" class="small">即使在当前代 Claude Opus 4.6 上</text>

  <rect x="450" y="80" width="370" height="280" class="hot"/>
  <text x="635" y="104" text-anchor="middle" class="label">v3.0 移除 / 软化</text>
  <text x="466" y="126" class="content">• 2023 暂停承诺已移除</text>
  <text x="466" y="142" class="small">（明确训练暂停条款删除）</text>
  <text x="466" y="162" class="content">• 定量阈值软化</text>
  <text x="466" y="178" class="small">为定性判断</text>
  <text x="466" y="198" class="content">• 具体缓解措施被替换为</text>
  <text x="466" y="214" class="content">“affirmative case”框架</text>
  <text x="466" y="234" class="content">• 独立审查仍弱</text>
  <text x="466" y="250" class="small">（内部 Safety Advisory Group 为主）</text>
  <text x="466" y="270" class="content">• 行业建议层允许</text>
  <text x="466" y="286" class="content">无承诺的政策倡导框架</text>

  <!-- SaferAI rating -->
  <rect x="60" y="380" width="760" height="110" class="warn"/>
  <text x="440" y="404" text-anchor="middle" class="label">SaferAI 独立评级</text>
  <text x="80" y="426" class="content">v2（2023）：2.2 — 中等</text>
  <text x="80" y="442" class="content">v3.0（2026）：1.9 — 弱（与 OpenAI Preparedness 和 DeepMind FSF 同属“弱”类）</text>
  <text x="80" y="462" class="content">降级原因：定性阈值 · 移除暂停 · 独立监督有限</text>
  <text x="80" y="482" class="small">政策看起来更精致却更不严谨；细读才是关键技能。</text>
</svg>
