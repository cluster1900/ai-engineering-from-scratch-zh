<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">MCP transports：stdio、Streamable HTTP、legacy SSE</text>

  <rect x="40" y="60" width="290" height="400" class="cool"/>
  <text x="185" y="82" text-anchor="middle" class="head">stdio（本地）</text>
  <text x="56" y="108" class="step">子进程</text>
  <text x="56" y="126" class="small">client 启动 server，</text>
  <text x="56" y="142" class="small">通过 stdin/stdout 通信</text>
  <text x="56" y="174" class="step">wire 格式</text>
  <text x="56" y="192" class="small">每行一个 JSON，\n</text>
  <text x="56" y="208" class="small">stdout 仅用于 JSON-RPC</text>
  <text x="56" y="224" class="small">stderr 用于日志</text>
  <text x="56" y="256" class="step">会话</text>
  <text x="56" y="274" class="small">process = session</text>
  <text x="56" y="290" class="small">无需 id</text>
  <text x="56" y="322" class="step">认证</text>
  <text x="56" y="340" class="small">继承父级信任</text>
  <text x="56" y="372" class="step">结论</text>
  <text x="56" y="390" class="small">仅本地服务器。</text>
  <text x="56" y="406" class="small">最简单，最可靠。</text>

  <rect x="345" y="60" width="290" height="400" class="cold"/>
  <text x="490" y="82" text-anchor="middle" class="head">Streamable HTTP（远程）</text>
  <text x="361" y="108" class="step">单端点 /mcp</text>
  <text x="361" y="126" class="small">POST：JSON-RPC 请求</text>
  <text x="361" y="142" class="small">GET：打开 SSE stream</text>
  <text x="361" y="158" class="small">DELETE：终止会话</text>
  <text x="361" y="190" class="step">会话</text>
  <text x="361" y="208" class="small">Mcp-Session-Id header</text>
  <text x="361" y="224" class="small">加密随机，</text>
  <text x="361" y="240" class="small">服务器分配</text>
  <text x="361" y="272" class="step">安全</text>
  <text x="361" y="290" class="small">Origin allowlist</text>
  <text x="361" y="306" class="small">DNS-rebinding 防护</text>
  <text x="361" y="322" class="small">OAuth 2.1（第 16 课）</text>
  <text x="361" y="354" class="step">重连</text>
  <text x="361" y="372" class="small">用相同 sid 重新 GET；</text>
  <text x="361" y="388" class="small">last-event-id 重放</text>
  <text x="361" y="420" class="step">结论</text>
  <text x="361" y="438" class="small">2026 标准。</text>

  <rect x="650" y="60" width="290" height="400" class="hot"/>
  <text x="795" y="82" text-anchor="middle" class="head">旧版 HTTP+SSE</text>
  <text x="666" y="108" class="step">两个端点</text>
  <text x="666" y="126" class="small">POST /messages</text>
  <text x="666" y="142" class="small">GET /sse（stream）</text>
  <text x="666" y="174" class="step">问题</text>
  <text x="666" y="192" class="small">CDN / WAF 不友好</text>
  <text x="666" y="208" class="small">要跟踪两个会话</text>
  <text x="666" y="224" class="small">长 SSE 超时</text>
  <text x="666" y="256" class="step">弃用</text>
  <text x="666" y="274" class="small">Atlassian Rovo：2026-06-30</text>
  <text x="666" y="290" class="small">Keboola：2026-04-01</text>
  <text x="666" y="306" class="small">官方 spec 标记 LEGACY</text>
  <text x="666" y="338" class="step">迁移</text>
  <text x="666" y="356" class="small">两个端点合为一个；</text>
  <text x="666" y="372" class="small">生成新 sid；</text>
  <text x="666" y="388" class="small">添加 Origin 检查</text>
  <text x="666" y="420" class="step">结论</text>
  <text x="666" y="438" class="small">2026 年中前迁移。</text>

  <text x="480" y="498" text-anchor="middle" class="caption">本地选 stdio，远程选 Streamable HTTP；SSE 模式只是临时桥接。</text>
</svg>
