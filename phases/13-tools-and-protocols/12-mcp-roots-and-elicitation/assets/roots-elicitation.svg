<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">2026-07-28：显式作用域 + 无状态 elicitation</text>

  <rect x="40" y="55" width="270" height="175" class="hot"/>
  <text x="175" y="80" text-anchor="middle" class="head">已弃用的 Roots</text>
  <text x="58" y="108" class="step">roots/list</text>
  <text x="58" y="128" class="step">notifications/roots/list_changed</text>
  <text x="58" y="158" class="small">仅作信息指引</text>
  <text x="58" y="176" class="small">并非授权</text>
  <text x="58" y="194" class="small">并非隔离</text>
  <text x="58" y="212" class="small">并非操作系统沙箱</text>

  <path d="M310,140 L380,140" class="edge" marker-end="url(#arrow)"/>
  <text x="345" y="132" text-anchor="middle" class="small">替换</text>

  <rect x="380" y="55" width="540" height="175" class="cool"/>
  <text x="650" y="80" text-anchor="middle" class="head">显式作用域和真实强制执行</text>
  <text x="400" y="108" class="step">arguments.workspaceUri = file:///.../Notes</text>
  <text x="400" y="136" class="small">1. 授权已认证主体访问 workspace</text>
  <text x="400" y="156" class="small">2. 规范化 URI 并强制路径组件包含约束</text>
  <text x="400" y="176" class="small">3. 变更前立即重新检查实时目标</text>
  <text x="400" y="196" class="small">4. 依靠进程沙箱实现技术隔离</text>
  <text x="400" y="216" class="small">范围对 Model、网关、日志和测试可见</text>

  <rect x="40" y="255" width="260" height="250" class="cold"/>
  <text x="170" y="280" text-anchor="middle" class="head">客户端</text>
  <text x="58" y="310" class="step">tools/call id 1</text>
  <text x="58" y="328" class="small">workspaceUri + title + _meta</text>
  <text x="58" y="360" class="step">渲染表单</text>
  <text x="58" y="378" class="small">显示服务器和原因</text>
  <text x="58" y="396" class="small">接受 | 拒绝 | 取消</text>
  <text x="58" y="428" class="step">tools/call id 2</text>
  <text x="58" y="446" class="small">相同参数 + inputResponses</text>
  <text x="58" y="464" class="small">原样回显 requestState</text>
  <text x="58" y="486" class="small">全新的独立请求</text>

  <rect x="660" y="255" width="260" height="250" class="cool"/>
  <text x="790" y="280" text-anchor="middle" class="head">服务器</text>
  <text x="678" y="310" class="step">tools/list + 表单门控 -32021</text>
  <text x="678" y="342" class="step">resultType: input_required</text>
  <text x="678" y="360" class="small">映射中的 elicitation/create</text>
  <text x="678" y="378" class="small">已签名候选项和过期时间</text>
  <text x="678" y="410" class="step">验证重试</text>
  <text x="678" y="428" class="small">状态、响应 schema、操作</text>
  <text x="678" y="446" class="small">授权和包含约束</text>
  <text x="678" y="478" class="step">resultType: complete</text>

  <path d="M300,320 L660,320" class="edge" marker-end="url(#arrow)"/>
  <path d="M660,370 L300,370" class="edge" marker-end="url(#arrow)"/>
  <path d="M300,440 L660,440" class="edge" marker-end="url(#arrow)"/>

  <rect x="40" y="525" width="880" height="25" class="box"/>
  <text x="480" y="542" text-anchor="middle" class="small">无 initialize、无反向请求、无隐藏协议会话，且不基于不可信范围执行变更。</text>
</svg>
