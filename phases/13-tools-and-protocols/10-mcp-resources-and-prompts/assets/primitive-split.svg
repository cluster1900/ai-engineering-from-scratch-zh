<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">tool vs resource vs prompt - 决策规则</text>

  <rect x="40" y="60" width="290" height="420" class="hot"/>
  <text x="185" y="82" text-anchor="middle" class="head">tool</text>
  <text x="185" y="106" text-anchor="middle" class="small">模型决定何时调用</text>
  <text x="56" y="140" class="step">示例：</text>
  <text x="56" y="158" class="small">notes_search(query)</text>
  <text x="56" y="174" class="small">notes_create(...)</text>
  <text x="56" y="190" class="small">github_open_pr(...)</text>
  <text x="56" y="210" class="step">调用格式：</text>
  <text x="56" y="228" class="small">tools/call name, args</text>
  <text x="56" y="244" class="small">返回内容块</text>
  <text x="56" y="260" class="small">失败时 isError</text>
  <text x="56" y="280" class="step">UX：</text>
  <text x="56" y="298" class="small">对话中调用</text>
  <text x="56" y="314" class="small">annotations 提示 UI</text>
  <text x="56" y="334" class="step">适用场景：</text>
  <text x="56" y="352" class="small">副作用或动作</text>
  <text x="56" y="368" class="small">计算转换</text>
  <text x="56" y="384" class="small">数据变更</text>
  <text x="56" y="410" class="step">决策信号：</text>
  <text x="56" y="428" class="small">应由模型决定</text>
  <text x="56" y="444" class="small">每个相关查询</text>

  <rect x="345" y="60" width="290" height="420" class="cool"/>
  <text x="490" y="82" text-anchor="middle" class="head">resource</text>
  <text x="490" y="106" text-anchor="middle" class="small">用户决定何时附加</text>
  <text x="361" y="140" class="step">示例：</text>
  <text x="361" y="158" class="small">notes://note-1</text>
  <text x="361" y="174" class="small">file:///path/to.md</text>
  <text x="361" y="190" class="small">db://schema/tables</text>
  <text x="361" y="210" class="step">调用格式：</text>
  <text x="361" y="228" class="small">resources/list</text>
  <text x="361" y="244" class="small">resources/read uri</text>
  <text x="361" y="260" class="small">resources/subscribe</text>
  <text x="361" y="280" class="step">UX：</text>
  <text x="361" y="298" class="small">resource 选择面板</text>
  <text x="361" y="314" class="small">include-file 对话框</text>
  <text x="361" y="334" class="step">适用场景：</text>
  <text x="361" y="352" class="small">只读数据</text>
  <text x="361" y="368" class="small">可用 URI 寻址</text>
  <text x="361" y="384" class="small">可能需 subscribe</text>
  <text x="361" y="410" class="step">决策信号：</text>
  <text x="361" y="428" class="small">用户想包含</text>
  <text x="361" y="444" class="small">作为上下文</text>

  <rect x="650" y="60" width="290" height="420" class="cold"/>
  <text x="795" y="82" text-anchor="middle" class="head">prompt</text>
  <text x="795" y="106" text-anchor="middle" class="small">可复用 workflow 模板</text>
  <text x="666" y="140" class="step">示例：</text>
  <text x="666" y="158" class="small">/review_note note_id</text>
  <text x="666" y="174" class="small">/summarize_pr pr_id</text>
  <text x="666" y="190" class="small">/triage_issue tag</text>
  <text x="666" y="210" class="step">调用格式：</text>
  <text x="666" y="228" class="small">prompts/list</text>
  <text x="666" y="244" class="small">prompts/get name, args</text>
  <text x="666" y="260" class="small">返回 messages[]</text>
  <text x="666" y="280" class="step">UX：</text>
  <text x="666" y="298" class="small">聊天中的 slash command</text>
  <text x="666" y="314" class="small">arg 选择对话框</text>
  <text x="666" y="334" class="step">适用场景：</text>
  <text x="666" y="352" class="small">多步 workflow</text>
  <text x="666" y="368" class="small">跨会话复用</text>
  <text x="666" y="384" class="small">用户想要快捷方式</text>
  <text x="666" y="410" class="step">决策信号：</text>
  <text x="666" y="428" class="small">规范 prompt 序列</text>
  <text x="666" y="444" class="small">值得命名</text>
</svg>
