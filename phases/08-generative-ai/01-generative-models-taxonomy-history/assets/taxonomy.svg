<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; }
      .mono { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">五类生成模型</text>
  <text x="450" y="50" text-anchor="middle" class="caption">按建模对象和采样方式划分</text>

  <rect x="380" y="70" width="140" height="44" class="box"/>
  <text x="450" y="90" text-anchor="middle" class="label">p_data(x)</text>
  <text x="450" y="106" text-anchor="middle" class="caption">未知，需要 sampler</text>

  <line x1="450" y1="114" x2="180" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="340" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="500" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="660" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="820" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="155" width="230" height="180" class="box"/>
  <text x="175" y="178" text-anchor="middle" class="label">1. 显式、可处理</text>
  <text x="175" y="200" text-anchor="middle" class="mono">p(x) = ∏ p(x_i | x_&lt;i)</text>
  <text x="175" y="225" text-anchor="middle" class="content">autoregressive：GPT、PixelCNN</text>
  <text x="175" y="245" text-anchor="middle" class="content">flows：Glow、RealNVP</text>
  <text x="175" y="275" text-anchor="middle" class="caption">精确 log p(x)</text>
  <text x="175" y="293" text-anchor="middle" class="caption">慢速顺序推理</text>
  <text x="175" y="311" text-anchor="middle" class="caption">架构限制（flows）</text>

  <rect x="305" y="155" width="230" height="180" class="hot"/>
  <text x="420" y="178" text-anchor="middle" class="label">2. 显式、近似</text>
  <text x="420" y="200" text-anchor="middle" class="mono">最大化 ELBO ≤ log p(x)</text>
  <text x="420" y="225" text-anchor="middle" class="content">VAE：encoder + decoder</text>
  <text x="420" y="245" text-anchor="middle" class="content">Diffusion：DDPM、SD3</text>
  <text x="420" y="275" text-anchor="middle" class="caption">2026 年主流</text>
  <text x="420" y="293" text-anchor="middle" class="caption">迭代采样（20-50 步）</text>
  <text x="420" y="311" text-anchor="middle" class="caption">扩展到文本、图像、视频、3D</text>

  <rect x="550" y="155" width="230" height="180" class="box"/>
  <text x="665" y="178" text-anchor="middle" class="label">3. 隐式密度</text>
  <text x="665" y="200" text-anchor="middle" class="mono">G(z) -&gt; x,  D(x) -&gt; real/fake</text>
  <text x="665" y="225" text-anchor="middle" class="content">GAN、StyleGAN、Pix2Pix</text>
  <text x="665" y="255" text-anchor="middle" class="caption">一次采样</text>
  <text x="665" y="273" text-anchor="middle" class="caption">完全没有 log p(x)</text>
  <text x="665" y="291" text-anchor="middle" class="caption">训练不稳定、mode collapse</text>
  <text x="665" y="309" text-anchor="middle" class="caption">窄域照片真实感仍是 SOTA</text>

  <rect x="60" y="350" width="350" height="150" class="box"/>
  <text x="235" y="373" text-anchor="middle" class="label">4. score / 连续时间</text>
  <text x="235" y="395" text-anchor="middle" class="mono">learn s(x) = ∇_x log p(x)</text>
  <text x="235" y="418" text-anchor="middle" class="content">score SDE、flow matching</text>
  <text x="235" y="438" text-anchor="middle" class="content">rectified flow、consistency models</text>
  <text x="235" y="465" text-anchor="middle" class="caption">免仿真训练</text>
  <text x="235" y="483" text-anchor="middle" class="caption">直线路径 =&gt; 1-4 步采样</text>

  <rect x="430" y="350" width="350" height="150" class="box"/>
  <text x="605" y="373" text-anchor="middle" class="label">5. Token + AR Transformer</text>
  <text x="605" y="395" text-anchor="middle" class="mono">VQ-VAE + 基于 Token 的 Transformer</text>
  <text x="605" y="418" text-anchor="middle" class="content">DALL-E 1、Parti、MuseNet</text>
  <text x="605" y="438" text-anchor="middle" class="content">AudioLM、VALL-E、MusicGen、Sora patches</text>
  <text x="605" y="465" text-anchor="middle" class="caption">复用 LLM 栈</text>
  <text x="605" y="483" text-anchor="middle" class="caption">质量受 Tokenizer 限制</text>
</svg>
