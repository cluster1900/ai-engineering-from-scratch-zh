<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">DeepSeek-V3 结构 — 总计 671B，激活 37B</text>

  <!-- stack -->
  <rect x="60" y="50" width="300" height="500" class="box"/>
  <text x="210" y="72" text-anchor="middle" class="head">完整栈 (61 blocks)</text>

  <rect x="80" y="88" width="260" height="36" class="cool"/>
  <text x="210" y="110" text-anchor="middle" class="step">Embedding (129k x 7168)</text>

  <rect x="80" y="130" width="260" height="42" class="old"/>
  <text x="210" y="148" text-anchor="middle" class="step">3 个 dense blocks</text>
  <text x="210" y="164" text-anchor="middle" class="small">MLA Attention + dense SwiGLU MLP (18432)</text>

  <rect x="80" y="180" width="260" height="232" class="dsk"/>
  <text x="210" y="200" text-anchor="middle" class="step">58 个 MoE blocks</text>
  <text x="210" y="220" text-anchor="middle" class="small">MLA Attention + MoE MLP</text>
  <text x="210" y="242" text-anchor="middle" class="small">256 个 experts (每个 2048 hidden)</text>
  <text x="210" y="262" text-anchor="middle" class="small">+ 1 个 shared expert (始终启用)</text>
  <text x="210" y="282" text-anchor="middle" class="small">router: aux-loss-free bias</text>
  <text x="210" y="302" text-anchor="middle" class="small">每 Token top-8 routing</text>
  <text x="210" y="324" text-anchor="middle" class="small">每个 Token 激活：</text>
  <text x="210" y="340" text-anchor="middle" class="small">8 个路由 + 1 个共享 = 9 个专家</text>
  <text x="210" y="362" text-anchor="middle" class="small">KV cache：512-dim MLA latent</text>
  <text x="210" y="382" text-anchor="middle" class="small">每 Token 每层</text>

  <rect x="80" y="420" width="260" height="36" class="hot"/>
  <text x="210" y="442" text-anchor="middle" class="step">1 个 MTP 模块</text>

  <rect x="80" y="462" width="260" height="36" class="cool"/>
  <text x="210" y="484" text-anchor="middle" class="step">最终 RMSNorm + LM head（tied）</text>

  <text x="210" y="530" text-anchor="middle" class="caption">总计 671B · 激活 37B · 比例 5.5%</text>

  <!-- Innovation callouts -->
  <rect x="400" y="50" width="520" height="500" class="box"/>
  <text x="660" y="72" text-anchor="middle" class="head">四项 DeepSeek 创新</text>

  <rect x="420" y="92" width="480" height="80" class="cool"/>
  <text x="440" y="114" class="step">1 / MLA — Multi-Head Latent Attention</text>
  <text x="440" y="134" class="small">将 K 和 V 压缩为共享 512-dim latent c^{KV}；</text>
  <text x="440" y="150" class="small">KV cache 存储 512 floats/Token/layer，而非 2 * heads * head_dim。</text>
  <text x="440" y="166" class="small">128k 时：7.6 GB vs GQA(8/128) 的 30.5 GB。节省 4x。</text>

  <rect x="420" y="180" width="480" height="80" class="hot"/>
  <text x="440" y="202" class="step">2 / MTP — Multi-Token Prediction</text>
  <text x="440" y="222" class="small">D=1 模块由 h^(1) + E(t+1) 预测 t+2。</text>
  <text x="440" y="238" class="small">训练信号更密，参数开销 2.1%（671B 中的 14B）。</text>
  <text x="440" y="254" class="small">推理时：作为 speculative-decoding draft，接受率 80%+。</text>

  <rect x="420" y="268" width="480" height="80" class="cold"/>
  <text x="440" y="290" class="step">3 / 无 aux-loss routing</text>
  <text x="440" y="310" class="small">训练中调整每个专家的 bias 项</text>
  <text x="440" y="326" class="small">以平衡负载，无需辅助 Loss 项。</text>
  <text x="440" y="342" class="small">效果相同，目标更简洁。</text>

  <rect x="420" y="356" width="480" height="80" class="dsk"/>
  <text x="440" y="378" class="step">4 / DualPipe 训练</text>
  <text x="440" y="398" class="small">2k H800 GPUs 上的双向 pipeline overlap。</text>
  <text x="440" y="414" class="small">将跨节点 all-to-all 隐藏在计算窗口内。</text>
  <text x="440" y="430" class="small">在 V3 规模下，相比 1F1B 节省 ~245k GPU-hours。</text>

  <rect x="420" y="444" width="480" height="100" class="box"/>
  <text x="440" y="466" class="step">带来什么</text>
  <text x="440" y="484" class="small">· 128k context，KV cache 可控（MLA）</text>
  <text x="440" y="500" class="small">· 相同 active FLOP 预算下更大容量（256 experts，top-8）</text>
  <text x="440" y="516" class="small">· decode throughput 免费提升 1.8x（MTP 作 spec-decode draft）</text>
  <text x="440" y="532" class="small">· 2k-rank 训练下 GPU 利用率 95%+（DualPipe）</text>
</svg>
