<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e8f1fb; stroke: #2471a3; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">四种 MARL 范式，同一 environment 形态</text>

  <rect x="40" y="60" width="200" height="170" class="box"/>
  <text x="140" y="88" text-anchor="middle" class="label">independent PPO / Q</text>
  <text x="60" y="115" class="content">每个 agent 都有自己的</text>
  <text x="60" y="135" class="content">policy 和 critic</text>
  <text x="60" y="160" class="content">把其他 agent 当作 env</text>
  <text x="140" y="195" text-anchor="middle" class="caption">简单，无 coord signal</text>
  <text x="140" y="215" text-anchor="middle" class="caption">在强耦合时失败</text>

  <rect x="260" y="60" width="200" height="170" class="hot"/>
  <text x="360" y="88" text-anchor="middle" class="label">CTDE (MAPPO/QMIX)</text>
  <text x="280" y="115" class="content">decentralized actor：</text>
  <text x="280" y="133" class="content">pi_i(a_i | o_i)</text>
  <text x="280" y="158" class="content">centralized critic：</text>
  <text x="280" y="176" class="content">Q(s, a_1, .., a_n)</text>
  <text x="360" y="210" text-anchor="middle" class="caption">2026 cooperative 默认</text>

  <rect x="480" y="60" width="200" height="170" class="cool"/>
  <text x="580" y="88" text-anchor="middle" class="label">self-play</text>
  <text x="500" y="115" class="content">单个 agent，两个角色</text>
  <text x="500" y="135" class="content">opponent = past snapshot</text>
  <text x="500" y="160" class="content">对称 gradients</text>
  <text x="580" y="195" text-anchor="middle" class="caption">zero-sum games</text>
  <text x="580" y="215" text-anchor="middle" class="caption">AlphaGo / AlphaZero</text>

  <rect x="700" y="60" width="160" height="170" class="box"/>
  <text x="780" y="88" text-anchor="middle" class="label">league play</text>
  <text x="715" y="115" class="content">policy 群体</text>
  <text x="715" y="133" class="content">过去 + 当前</text>
  <text x="715" y="153" class="content">policies；采样</text>
  <text x="715" y="171" class="content">对手</text>
  <text x="780" y="210" text-anchor="middle" class="caption">AlphaStar</text>

  <rect x="40" y="260" width="820" height="150" class="box"/>
  <text x="450" y="285" text-anchor="middle" class="label">核心难点</text>
  <text x="60" y="315" class="content">从 agent i 视角，环境现在包含 pi_{-i}</text>
  <text x="60" y="335" class="content">随着 pi_{-i} 学习，transition P(s' | s, a_i) 非平稳</text>
  <text x="60" y="355" class="content">Markov property 失效 -&gt; tabular 收敛证明不再适用</text>
  <text x="60" y="378" class="caption">CTDE 通过让 critic 条件化于完整 joint action 修复；self-play 通过结构修复</text>

  <text x="450" y="445" text-anchor="middle" class="caption">加入通信、语言或 MCTS，就得到 StarCraft II / Dota 2 / multi-agent LLM 系统</text>
</svg>
