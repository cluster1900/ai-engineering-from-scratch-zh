<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="28" text-anchor="middle" class="title">四个原语——每个 2026 multi-agent 框架都符合此形态</text>

  <rect x="40" y="60" width="220" height="180" class="cool"/>
  <text x="150" y="82" text-anchor="middle" class="head">Agent</text>
  <text x="150" y="108" text-anchor="middle" class="step">system_prompt + tools</text>
  <text x="150" y="128" text-anchor="middle" class="small">无状态函数</text>
  <text x="150" y="146" text-anchor="middle" class="small">基于 (Prompt, Tools, Model)</text>
  <text x="150" y="174" text-anchor="middle" class="small">AutoGen：ConversableAgent</text>
  <text x="150" y="190" text-anchor="middle" class="small">CrewAI：角色 + 目标 + 背景故事</text>
  <text x="150" y="206" text-anchor="middle" class="small">LangGraph：节点函数</text>
  <text x="150" y="222" text-anchor="middle" class="small">Swarm：Agent(instructions, tools)</text>

  <rect x="280" y="60" width="220" height="180" class="hot"/>
  <text x="390" y="82" text-anchor="middle" class="head">Handoff</text>
  <text x="390" y="108" text-anchor="middle" class="step">控制权转移</text>
  <text x="390" y="128" text-anchor="middle" class="small">三种实现：</text>
  <text x="390" y="148" text-anchor="middle" class="small">1 函数返回 (Swarm)</text>
  <text x="390" y="166" text-anchor="middle" class="small">2 图边 (LangGraph)</text>
  <text x="390" y="184" text-anchor="middle" class="small">3 发言者选择 (AutoGen)</text>
  <text x="390" y="210" text-anchor="middle" class="caption">始终为：(from, to, optional payload)</text>

  <rect x="520" y="60" width="220" height="180" class="cold"/>
  <text x="630" y="82" text-anchor="middle" class="head">共享状态</text>
  <text x="630" y="108" text-anchor="middle" class="step">唯一有状态之物</text>
  <text x="630" y="128" text-anchor="middle" class="small">消息池</text>
  <text x="630" y="146" text-anchor="middle" class="small">黑板</text>
  <text x="630" y="164" text-anchor="middle" class="small">StateGraph reducer</text>
  <text x="630" y="182" text-anchor="middle" class="small">MCP 共享 Context</text>
  <text x="630" y="210" text-anchor="middle" class="caption">记忆投毒发生在这里</text>

  <rect x="760" y="60" width="180" height="180" class="dsk"/>
  <text x="850" y="82" text-anchor="middle" class="head">编排器</text>
  <text x="850" y="108" text-anchor="middle" class="step">谁下一个发言</text>
  <text x="850" y="128" text-anchor="middle" class="small">静态图</text>
  <text x="850" y="146" text-anchor="middle" class="small">由 LLM 选择</text>
  <text x="850" y="164" text-anchor="middle" class="small">由 Handoff 驱动</text>
  <text x="850" y="182" text-anchor="middle" class="small">由队列驱动</text>
  <text x="850" y="210" text-anchor="middle" class="caption">覆盖其他三者的调度器</text>

  <rect x="40" y="280" width="900" height="210" class="box"/>
  <text x="490" y="304" text-anchor="middle" class="head">将 2026 框架映射到四个轴</text>

  <text x="60" y="336" class="step">OpenAI Swarm / Agents SDK</text>
  <text x="340" y="336" class="small">Agent = Agent(instructions, tools)</text>
  <text x="340" y="352" class="small">Handoff = Tool 返回 Agent · 共享状态推给调用方 · Orchestrator = LLM 的 Handoff 调用</text>

  <text x="60" y="376" class="step">AutoGen v0.4 / AG2</text>
  <text x="340" y="376" class="small">Agent = ConversableAgent</text>
  <text x="340" y="392" class="small">Handoff = 发言者选择 · 共享状态 = 消息池 · Orchestrator = 选择器函数（LLM 或轮询）</text>

  <text x="60" y="416" class="step">CrewAI</text>
  <text x="340" y="416" class="small">Agent = 角色 + 目标 + 背景故事</text>
  <text x="340" y="432" class="small">Handoff = Process.Sequential / Hierarchical · 共享状态 = Task 输出 · Orchestrator = 管理器 LLM</text>

  <text x="60" y="456" class="step">LangGraph</text>
  <text x="340" y="456" class="small">Agent = 节点函数</text>
  <text x="340" y="472" class="small">Handoff = 图边 · 共享状态 = StateGraph reducer · Orchestrator = 图（确定性）</text>
</svg>
