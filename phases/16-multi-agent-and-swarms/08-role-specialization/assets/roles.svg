<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <text x="450" y="28" text-anchor="middle" class="title">角色专门化 — planner、executor、critic、verifier</text>

  <rect x="40" y="60" width="170" height="100" class="cool"/>
  <text x="125" y="82" text-anchor="middle" class="head">Planner</text>
  <text x="125" y="104" text-anchor="middle" class="small">读取目标</text>
  <text x="125" y="120" text-anchor="middle" class="small">产出 spec</text>
  <text x="125" y="138" text-anchor="middle" class="small">(signature, tests, I/O)</text>
  <text x="125" y="154" text-anchor="middle" class="small">MetaGPT: PM + Architect</text>

  <line x1="210" y1="110" x2="250" y2="110" class="edge" marker-end="url(#arrow)"/>

  <rect x="250" y="60" width="170" height="100" class="hot"/>
  <text x="335" y="82" text-anchor="middle" class="head">Executor</text>
  <text x="335" y="104" text-anchor="middle" class="small">读取一步</text>
  <text x="335" y="120" text-anchor="middle" class="small">产出 artifact</text>
  <text x="335" y="138" text-anchor="middle" class="small">拥有真实工具</text>
  <text x="335" y="154" text-anchor="middle" class="small">ChatDev：不清楚就问</text>

  <line x1="420" y1="110" x2="460" y2="110" class="edge" marker-end="url(#arrow)"/>

  <rect x="460" y="60" width="170" height="100" class="dsk"/>
  <text x="545" y="82" text-anchor="middle" class="head">Critic</text>
  <text x="545" y="104" text-anchor="middle" class="small">主观 review</text>
  <text x="545" y="120" text-anchor="middle" class="small">发现品味问题</text>
  <text x="545" y="138" text-anchor="middle" class="small">会被貌似合理的文字骗过</text>
  <text x="545" y="154" text-anchor="middle" class="small">(基于 LLM)</text>

  <line x1="630" y1="110" x2="670" y2="110" class="edge" marker-end="url(#arrow)"/>

  <rect x="670" y="60" width="200" height="100" class="cold"/>
  <text x="770" y="82" text-anchor="middle" class="head">Verifier</text>
  <text x="770" y="104" text-anchor="middle" class="small">确定性检查</text>
  <text x="770" y="120" text-anchor="middle" class="small">tests, type, schema</text>
  <text x="770" y="138" text-anchor="middle" class="small">无法被骗过</text>
  <text x="770" y="154" text-anchor="middle" class="small">(代码，不是 LLM)</text>

  <line x1="335" y1="160" x2="335" y2="200" class="edge"/>
  <path d="M 335 200 Q 300 220 265 200" class="edge" fill="none" stroke-dasharray="3 3"/>
  <text x="295" y="195" class="small">沟通式去幻觉（ChatDev）</text>

  <rect x="40" y="240" width="830" height="110" class="box"/>
  <text x="450" y="262" text-anchor="middle" class="head">为什么 verifier 是承重角色</text>
  <text x="450" y="284" text-anchor="middle" class="small">MAST 分类法（Cemri et al. 2025）：1642 个多 agent 失败中 21.3% 是验证缺口</text>
  <text x="450" y="304" text-anchor="middle" class="small">PwC 2025：CrewAI 中结构化验证循环使准确率 10% -&gt; 70%（7× 增益）</text>
  <text x="450" y="324" text-anchor="middle" class="small">反模式：每个角色都是说“我看挺好”的 LLM — 经典 MAST 失败</text>
  <text x="450" y="342" text-anchor="middle" class="small">始终配对 critic（主观）与 verifier（确定性）；它们发现不同 bug</text>

  <rect x="40" y="370" width="830" height="110" class="box"/>
  <text x="450" y="392" text-anchor="middle" class="head">MetaGPT 的 SOP 模式</text>
  <text x="450" y="412" text-anchor="middle" class="small">Code = SOP(Team): Product Manager, Architect, Project Manager, Engineer, QA Engineer</text>
  <text x="450" y="430" text-anchor="middle" class="small">每个角色都有严格输入/输出 schema · pipeline 变得确定性</text>
  <text x="450" y="450" text-anchor="middle" class="small">CrewAI Agent(role, goal, backstory) 是现代易用界面</text>
  <text x="450" y="470" text-anchor="middle" class="small">LangGraph 将角色编码为带专用 prompt 的图节点</text>
</svg>
