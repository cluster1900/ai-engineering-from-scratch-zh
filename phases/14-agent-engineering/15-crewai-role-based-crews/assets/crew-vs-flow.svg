<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .crew { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .flow { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .primitive { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">CrewAI — 面向生产的 Agent、Task、Crew、Process + Flow</text>

  <rect x="40" y="50" width="880" height="140" class="primitive"/>
  <text x="480" y="72" text-anchor="middle" class="head">四个原语</text>
  <rect x="60" y="88" width="200" height="86" class="box"/>
  <text x="160" y="108" text-anchor="middle" class="step">Agent</text>
  <text x="78" y="128" class="small">角色 + 目标 + 背景 + tools</text>
  <text x="78" y="144" class="small">背景塑造语气 + 判断</text>
  <text x="78" y="160" class="small">保持精炼（&lt;200 词）</text>
  <rect x="280" y="88" width="200" height="86" class="box"/>
  <text x="380" y="108" text-anchor="middle" class="step">Task</text>
  <text x="298" y="128" class="small">描述 + expected_output</text>
  <text x="298" y="144" class="small">分配给一个 Agent</text>
  <text x="298" y="160" class="small">可复用；组合成 Crews</text>
  <rect x="500" y="88" width="200" height="86" class="box"/>
  <text x="600" y="108" text-anchor="middle" class="step">Crew</text>
  <text x="518" y="128" class="small">容器：Agents + Tasks</text>
  <text x="518" y="144" class="small">拥有 Process</text>
  <text x="518" y="160" class="small">Sequential | Hierarchical | Consensual</text>
  <rect x="720" y="88" width="180" height="86" class="box"/>
  <text x="810" y="108" text-anchor="middle" class="step">Process</text>
  <text x="738" y="128" class="small">执行策略</text>
  <text x="738" y="144" class="small">Hierarchical 添加 manager</text>
  <text x="738" y="160" class="small">仅在 4+ 专家时使用</text>

  <rect x="40" y="210" width="420" height="300" class="crew"/>
  <text x="250" y="232" text-anchor="middle" class="head">Crew 自主协作</text>
  <rect x="60" y="248" width="380" height="40" class="box"/>
  <text x="78" y="270" class="step">研究者  提纲者  起草者</text>
  <text x="78" y="284" class="small">自由形式；Process 运行时选形态</text>
  <rect x="60" y="296" width="380" height="40" class="box"/>
  <text x="78" y="318" class="step">Hierarchical：manager Agent 选择下一个专家</text>
  <rect x="60" y="344" width="380" height="40" class="box"/>
  <text x="78" y="366" class="step">适合：探索、初稿、头脑风暴</text>
  <rect x="60" y="392" width="380" height="40" class="box"/>
  <text x="78" y="414" class="step">不适合：生产回放、确定性审计、SLAs</text>
  <rect x="60" y="440" width="380" height="60" class="box"/>
  <text x="78" y="462" class="step">输出差异：高</text>
  <text x="78" y="478" class="small">若 Process=Hierarchical，LLM 选择 Task 顺序</text>
  <text x="78" y="494" class="small">debug 路径：读 trace；没有图可读</text>

  <rect x="480" y="210" width="440" height="300" class="flow"/>
  <text x="700" y="232" text-anchor="middle" class="head">Flow 事件驱动、确定性</text>
  <rect x="500" y="248" width="400" height="40" class="box"/>
  <text x="518" y="270" class="step">@start  researched  outlined  drafted</text>
  <text x="518" y="284" class="small">代码拥有图；工程师拥有形态</text>
  <rect x="500" y="296" width="400" height="40" class="box"/>
  <text x="518" y="318" class="step">@listen("researched")：该 topic 发出时触发</text>
  <rect x="500" y="344" width="400" height="40" class="box"/>
  <text x="518" y="366" class="step">适合：生产、回放、SLAs、审计</text>
  <rect x="500" y="392" width="400" height="40" class="box"/>
  <text x="518" y="414" class="step">不适合：开放式创意</text>
  <rect x="500" y="440" width="400" height="60" class="box"/>
  <text x="518" y="462" class="step">2026 docs：生产从 Flow 开始</text>
  <text x="518" y="478" class="small">当自主性值得成本时，把 Crews 折入子步骤</text>
  <text x="518" y="494" class="small">可观测性：每个事件都是 span</text>

  <text x="480" y="540" text-anchor="middle" class="caption">同一个三步 Task；Crew 流动，Flow 固定。选择是运营层面，不是架构层面。</text>
</svg>
