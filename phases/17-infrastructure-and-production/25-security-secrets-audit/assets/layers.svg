<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .vault { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .pii { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .net { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .audit { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM 安全 — 四层，默认 zero-trust</text>

  <rect x="40" y="50" width="220" height="180" class="vault"/>
  <text x="150" y="72" text-anchor="middle" class="head">secrets（vault）</text>
  <text x="60" y="96" class="step">· HashiCorp Vault</text>
  <text x="60" y="114" class="step">· AWS Secrets Manager</text>
  <text x="60" y="132" class="step">· Azure Key Vault</text>
  <text x="60" y="150" class="step">· GCP Secret Manager</text>
  <text x="60" y="178" class="small">IAM role + 短期有效</text>
  <text x="60" y="196" class="small">CI/CD 用 OIDC</text>
  <text x="60" y="214" class="small">轮换 ≤ 90 天</text>

  <rect x="280" y="50" width="220" height="180" class="pii"/>
  <text x="390" y="72" text-anchor="middle" class="head">PII 清洗</text>
  <text x="300" y="96" class="step">· Presidio / spaCy NER</text>
  <text x="300" y="114" class="step">· regex（SSN、email、phone）</text>
  <text x="300" y="132" class="step">· 一致 Tokenization</text>
  <text x="300" y="150" class="step">· Mesh 方法</text>
  <text x="300" y="178" class="small">同值 → 同占位符</text>
  <text x="300" y="196" class="small">保留 LLM 语义</text>
  <text x="300" y="214" class="small">可选反向映射</text>

  <rect x="520" y="50" width="220" height="180" class="net"/>
  <text x="630" y="72" text-anchor="middle" class="head">网络出口</text>
  <text x="540" y="96" class="step">仅白名单：</text>
  <text x="540" y="114" class="step">api.openai.com</text>
  <text x="540" y="132" class="step">api.anthropic.com</text>
  <text x="540" y="150" class="step">vault 端点</text>
  <text x="540" y="168" class="step">vector DB</text>
  <text x="540" y="196" class="small">仅 DNS allowlist</text>
  <text x="540" y="214" class="small">防止隧道外泄</text>

  <rect x="760" y="50" width="160" height="180" class="audit"/>
  <text x="840" y="72" text-anchor="middle" class="head">审计日志</text>
  <text x="780" y="96" class="step">仅追加</text>
  <text x="780" y="114" class="step">每次调用：</text>
  <text x="780" y="132" class="small">· user / tenant</text>
  <text x="780" y="148" class="small">· prompt/resp hash</text>
  <text x="780" y="164" class="small">· tokens + 成本</text>
  <text x="780" y="180" class="small">· guardrail 触发</text>
  <text x="780" y="204" class="small">SOC2：1 年</text>
  <text x="780" y="220" class="small">HIPAA：6 年</text>

  <rect x="40" y="260" width="880" height="100" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">网关模式（Phase 17 · 19）</text>
  <text x="480" y="304" text-anchor="middle" class="step">app → gateway → model provider</text>
  <text x="480" y="322" text-anchor="middle" class="step">gateway 运行时从 vault 拉取凭据</text>
  <text x="480" y="340" text-anchor="middle" class="caption">在 vault 轮换 → apps 数分钟内生效；无需 redeploy</text>

  <rect x="40" y="380" width="880" height="110" class="box"/>
  <text x="480" y="402" text-anchor="middle" class="head">2026 事故驱动因素</text>
  <text x="480" y="424" text-anchor="middle" class="step">Vercel 供应链攻击：CI/CD 凭据被攻破</text>
  <text x="480" y="444" text-anchor="middle" class="step">数千客户部署的 env vars 被外泄</text>
  <text x="480" y="464" text-anchor="middle" class="caption">CI/CD creds 等同 prod；存入 vault，严格限定 scope，积极轮换</text>
</svg>
