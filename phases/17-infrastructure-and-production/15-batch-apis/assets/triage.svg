<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .inter { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .semi { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .batch { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">workload 分流 — 三条 lane，一条规则</text>

  <rect x="40" y="50" width="280" height="340" class="inter"/>
  <text x="180" y="72" text-anchor="middle" class="head">交互式</text>
  <text x="180" y="94" text-anchor="middle" class="step">用户等待响应</text>
  <text x="60" y="122" class="small">· TTFT 很重要</text>
  <text x="60" y="140" class="small">· sync call + prompt cache</text>
  <text x="60" y="158" class="small">· 不能 batch</text>
  <text x="60" y="176" class="small">· 示例：chat, voice agent, search</text>
  <text x="60" y="220" class="step">基准成本的 100%</text>
  <text x="60" y="238" class="small">（减去缓存节省）</text>

  <rect x="340" y="50" width="280" height="340" class="semi"/>
  <text x="480" y="72" text-anchor="middle" class="head">半交互式</text>
  <text x="480" y="94" text-anchor="middle" class="step">用户几分钟后回来查看</text>
  <text x="360" y="122" class="small">· async queue + fallback to sync</text>
  <text x="360" y="140" class="small">· 可容忍 P99 ~5-10 分钟</text>
  <text x="360" y="158" class="small">· 示例：中等 RAG 索引，</text>
  <text x="360" y="176" class="small">“refresh” 报告，semi-live agent</text>
  <text x="360" y="220" class="step">~基准成本的 50%</text>
  <text x="360" y="238" class="small">（含缓存 + queue 摊销）</text>

  <rect x="640" y="50" width="280" height="340" class="batch"/>
  <text x="780" y="72" text-anchor="middle" class="head">batch</text>
  <text x="780" y="94" text-anchor="middle" class="step">结果“明早前”</text>
  <text x="660" y="122" class="small">· 始终 batch，始终叠加 cache</text>
  <text x="660" y="140" class="small">· 24h SLA，典型 2-6h P50</text>
  <text x="660" y="158" class="small">· 示例：内容流水线，</text>
  <text x="660" y="176" class="small">Classification, 标注，报告</text>
  <text x="660" y="220" class="step">~基准成本的 10%</text>
  <text x="660" y="238" class="small">（batch 50% off + cached input 10x）</text>

  <rect x="40" y="410" width="880" height="60" class="box"/>
  <text x="480" y="432" text-anchor="middle" class="head">规则</text>
  <text x="480" y="454" text-anchor="middle" class="step">如果用户可接受 24h 延迟，该 workload 就应放到 batch</text>
</svg>
