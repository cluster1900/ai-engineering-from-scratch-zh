<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .eval { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .ab { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .method { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">A/B testing LLM features —— evals + 线上，不靠感觉</text>

  <rect x="40" y="50" width="440" height="120" class="eval"/>
  <text x="260" y="72" text-anchor="middle" class="head">evals（离线，带标签）</text>
  <text x="260" y="92" text-anchor="middle" class="step">“模型能完成任务吗？”</text>
  <text x="60" y="116" class="small">· 人工标注或 LLM-as-judge</text>
  <text x="60" y="134" class="small">· 固定分布（非用户流量）</text>
  <text x="60" y="152" class="small">· 暴露前捕捉回归</text>

  <rect x="500" y="50" width="440" height="120" class="ab"/>
  <text x="720" y="72" text-anchor="middle" class="head">A/B tests（线上，随机）</text>
  <text x="720" y="92" text-anchor="middle" class="step">“用户在乎吗？”</text>
  <text x="520" y="116" class="small">· 实时流量，随机分配</text>
  <text x="520" y="134" class="small">· 关键用户级指标（留存、CTR）</text>
  <text x="520" y="152" class="small">· 确认产品影响</text>

  <rect x="40" y="190" width="280" height="120" class="method"/>
  <text x="180" y="212" text-anchor="middle" class="head">测试什么</text>
  <text x="60" y="236" class="step">· prompt wording</text>
  <text x="60" y="254" class="step">· model selection（GPT vs OSS）</text>
  <text x="60" y="272" class="step">· generation params（temp, top-p）</text>
  <text x="60" y="290" class="step">· reward functions / routers</text>

  <rect x="340" y="190" width="280" height="120" class="method"/>
  <text x="480" y="212" text-anchor="middle" class="head">方法严谨性</text>
  <text x="360" y="236" class="step">· CUPED（方差降 30-70%）</text>
  <text x="360" y="254" class="step">· sequential（始终有效的 peek）</text>
  <text x="360" y="272" class="step">· Bonferroni / Benjamini-Hochberg</text>
  <text x="360" y="290" class="step">· SRM 检查（sample ratio）</text>

  <rect x="640" y="190" width="280" height="120" class="method"/>
  <text x="780" y="212" text-anchor="middle" class="head">平台</text>
  <text x="660" y="236" class="step">Statsig（OpenAI 旗下，$1.1B）</text>
  <text x="660" y="254" class="step">GrowthBook（MIT，warehouse-native）</text>
  <text x="660" y="272" class="step">Eppo、Optimizely Experiments</text>
  <text x="660" y="290" class="step">LaunchDarkly Experiments</text>

  <rect x="40" y="330" width="880" height="140" class="box"/>
  <text x="480" y="352" text-anchor="middle" class="head">LLM 非确定性让 power 更复杂</text>
  <text x="480" y="374" text-anchor="middle" class="step">相同输入可有最高 15% 逐次运行方差</text>
  <text x="480" y="394" text-anchor="middle" class="step">sample size 比传统 power calc 增加 ×1.3-1.5 缓冲</text>
  <text x="480" y="416" text-anchor="middle" class="caption">真实案例：chatbot +70% 对话长度 · Nextdoor +1% CTR · Khanmigo 延迟-准确率循环</text>
  <text x="480" y="438" text-anchor="middle" class="caption">evals 捕捉回归；A/B 确认影响；凭感觉上线已结束</text>
</svg>
