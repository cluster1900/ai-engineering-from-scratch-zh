<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .node { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .sched { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .app { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .bad { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">GPU 自动扩缩容 — 三层，不是一层</text>

  <rect x="40" y="50" width="280" height="480" class="box"/>
  <text x="180" y="72" text-anchor="middle" class="head">第 1 层 — 节点配置</text>
  <rect x="60" y="90" width="240" height="70" class="node"/>
  <text x="180" y="112" text-anchor="middle" class="step">Karpenter</text>
  <text x="180" y="130" text-anchor="middle" class="small">根据待调度 Pod 配置节点</text>
  <text x="180" y="146" text-anchor="middle" class="small">45-60s（对比 CA 90-120s）</text>
  <rect x="60" y="170" width="240" height="90" class="bad"/>
  <text x="180" y="192" text-anchor="middle" class="step">整合陷阱</text>
  <text x="180" y="210" text-anchor="middle" class="small">WhenEmptyOrUnderutilized</text>
  <text x="180" y="226" text-anchor="middle" class="small">驱逐运行中的 GPU 作业</text>
  <text x="180" y="244" text-anchor="middle" class="small">损失数分钟容量</text>
  <rect x="60" y="270" width="240" height="100" class="node"/>
  <text x="180" y="292" text-anchor="middle" class="step">安全设置</text>
  <text x="180" y="310" text-anchor="middle" class="small">consolidationPolicy:</text>
  <text x="180" y="326" text-anchor="middle" class="small">WhenEmpty</text>
  <text x="180" y="342" text-anchor="middle" class="small">consolidateAfter: 1h</text>
  <text x="180" y="358" text-anchor="middle" class="small">为 GPU 节点添加污点</text>
  <text x="180" y="400" text-anchor="middle" class="caption">动态选择实例类型</text>

  <rect x="340" y="50" width="280" height="480" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">第 2 层 — 组调度</text>
  <rect x="360" y="90" width="240" height="70" class="sched"/>
  <text x="480" y="112" text-anchor="middle" class="step">KAI Scheduler</text>
  <text x="480" y="130" text-anchor="middle" class="small">kube-scheduler 的辅助调度器</text>
  <text x="480" y="146" text-anchor="middle" class="small">标注工作负载以选择启用</text>
  <rect x="360" y="170" width="240" height="100" class="sched"/>
  <text x="480" y="192" text-anchor="middle" class="step">组调度</text>
  <text x="480" y="210" text-anchor="middle" class="small">全有或全无放置</text>
  <text x="480" y="226" text-anchor="middle" class="small">避免 8 个仅就绪 7 个的空闲陷阱</text>
  <text x="480" y="244" text-anchor="middle" class="small">放不下全部就全部延后</text>
  <rect x="360" y="280" width="240" height="80" class="sched"/>
  <text x="480" y="302" text-anchor="middle" class="step">拓扑感知</text>
  <text x="480" y="320" text-anchor="middle" class="small">NVLink / IB / 机架放置</text>
  <text x="480" y="336" text-anchor="middle" class="small">TP-8 保持在同一 NVLink 域</text>
  <rect x="360" y="370" width="240" height="90" class="sched"/>
  <text x="480" y="392" text-anchor="middle" class="step">分层队列</text>
  <text x="480" y="410" text-anchor="middle" class="small">多团队优先级 + 配额</text>
  <text x="480" y="426" text-anchor="middle" class="small">每队列抢占规则</text>
  <text x="480" y="442" text-anchor="middle" class="small">Ray + vLLM 生产栈集成</text>

  <rect x="640" y="50" width="280" height="480" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">第 3 层 — 应用信号</text>
  <rect x="660" y="90" width="240" height="80" class="bad"/>
  <text x="780" y="112" text-anchor="middle" class="step">HPA 陷阱</text>
  <text x="780" y="130" text-anchor="middle" class="small">DCGM_FI_DEV_GPU_UTIL</text>
  <text x="780" y="146" text-anchor="middle" class="small">占空比，不是负载</text>
  <text x="780" y="162" text-anchor="middle" class="small">100% = 10 或 100 个请求</text>
  <rect x="660" y="180" width="240" height="100" class="app"/>
  <text x="780" y="202" text-anchor="middle" class="step">正确信号</text>
  <text x="780" y="220" text-anchor="middle" class="small">队列深度</text>
  <text x="780" y="236" text-anchor="middle" class="small">KV cache 利用率</text>
  <text x="780" y="252" text-anchor="middle" class="small">每个副本的 P99 TTFT</text>
  <text x="780" y="268" text-anchor="middle" class="small">有效吞吐量（满足 SLO 的 RPS）</text>
  <rect x="660" y="290" width="240" height="90" class="app"/>
  <text x="780" y="312" text-anchor="middle" class="step">Dynamo Planner</text>
  <text x="780" y="330" text-anchor="middle" class="small">按推理信号扩缩容</text>
  <text x="780" y="346" text-anchor="middle" class="small">匹配 prefill:decode 比率</text>
  <text x="780" y="362" text-anchor="middle" class="small">满足 SLO，而非占空比</text>
  <rect x="660" y="390" width="240" height="90" class="app"/>
  <text x="780" y="412" text-anchor="middle" class="step">llm-d WVA</text>
  <text x="780" y="430" text-anchor="middle" class="small">工作负载变体自动扩缩器</text>
  <text x="780" y="446" text-anchor="middle" class="small">解耦 prefill + decode</text>
  <text x="780" y="462" text-anchor="middle" class="small">按角色配置 HPA</text>

  <rect x="40" y="540" width="880" height="30" class="box"/>
  <text x="480" y="558" text-anchor="middle" class="step">三层组合 — 在真实 GPU 集群中，单独任何一层都不够</text>
</svg>
