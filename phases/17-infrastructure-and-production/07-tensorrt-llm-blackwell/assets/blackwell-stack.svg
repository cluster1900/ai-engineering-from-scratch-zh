<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">Blackwell + TRT-LLM stack - 7x 成本差距从何而来</text>

  <rect x="40" y="50" width="440" height="470" class="box"/>
  <text x="260" y="72" text-anchor="middle" class="head">Blackwell 上的精度制度</text>
  <rect x="60" y="90" width="400" height="60" class="cool"/>
  <text x="260" y="112" text-anchor="middle" class="step">权重：NVFP4（4-bit microscaling）</text>
  <text x="260" y="130" text-anchor="middle" class="small">每个 decoded Token 字节数为 FP8 的一半</text>
  <text x="260" y="144" text-anchor="middle" class="small">模型提供方交付 day-0 FP4 权重</text>
  <rect x="60" y="160" width="400" height="60" class="hot"/>
  <text x="260" y="182" text-anchor="middle" class="step">KV cache：FP8（仍然关键）</text>
  <text x="260" y="200" text-anchor="middle" class="small">FP4 KV 会压垮 Attention 尾部</text>
  <text x="260" y="214" text-anchor="middle" class="small">FP8 指数位保留动态范围</text>
  <rect x="60" y="230" width="400" height="60" class="cold"/>
  <text x="260" y="252" text-anchor="middle" class="step">激活值：NVFP4</text>
  <text x="260" y="270" text-anchor="middle" class="small">层内小范围；FP4 扛得住</text>
  <text x="260" y="284" text-anchor="middle" class="small">Tensor Cores 上有 MXFP8 变体</text>
  <rect x="60" y="300" width="400" height="60" class="dsk"/>
  <text x="260" y="322" text-anchor="middle" class="step">Attention 累加器：FP32</text>
  <text x="260" y="340" text-anchor="middle" class="small">softmax 稳定性需要更高精度</text>
  <text x="260" y="354" text-anchor="middle" class="small">这一层不能协商</text>
  <rect x="60" y="370" width="400" height="140" class="box"/>
  <text x="260" y="392" text-anchor="middle" class="head">质量注意点</text>
  <text x="260" y="414" text-anchor="middle" class="small">reasoning 工作负载上的 NVFP4 权重：</text>
  <text x="260" y="430" text-anchor="middle" class="small">数学、chain-of-thought、长上下文代码：</text>
  <text x="260" y="446" text-anchor="middle" class="small">无 per-block calib 时质量明显下降</text>
  <text x="260" y="466" text-anchor="middle" class="small">恢复：FP8 权重 + FP4 激活值</text>
  <text x="260" y="482" text-anchor="middle" class="small">或留在 H200 全程 FP8</text>
  <text x="260" y="502" text-anchor="middle" class="caption">迁移前始终验证 eval 质量</text>

  <rect x="500" y="50" width="420" height="470" class="box"/>
  <text x="710" y="72" text-anchor="middle" class="head">叠加差距的 stack 层</text>

  <rect x="520" y="90" width="380" height="60" class="cool"/>
  <text x="710" y="112" text-anchor="middle" class="step">1 / 硬件带宽</text>
  <text x="710" y="130" text-anchor="middle" class="small">H100 3.35 TB/s vs B200 8.0 TB/s：~2.4x</text>
  <text x="710" y="144" text-anchor="middle" class="small">decode 受内存限制；这是下限</text>

  <rect x="520" y="160" width="380" height="60" class="hot"/>
  <text x="710" y="182" text-anchor="middle" class="step">2 / NVFP4 权重</text>
  <text x="710" y="200" text-anchor="middle" class="small">每 Token 字节减半：~2.0x</text>
  <text x="710" y="214" text-anchor="middle" class="small">NVFP4 是现在唯一重要的权重精度</text>

  <rect x="520" y="230" width="380" height="60" class="cold"/>
  <text x="710" y="252" text-anchor="middle" class="step">3 / MTP draft</text>
  <text x="710" y="270" text-anchor="middle" class="small">multi-token prediction head：accepted tokens 上 ~1.8x</text>
  <text x="710" y="284" text-anchor="middle" class="small">集成在 TRT-LLM build 中</text>

  <rect x="520" y="300" width="380" height="60" class="dsk"/>
  <text x="710" y="322" text-anchor="middle" class="step">4 / prefill/decode 解耦</text>
  <text x="710" y="340" text-anchor="middle" class="small">Dynamo 编排独立 GPU 池：~1.6-2.5x</text>
  <text x="710" y="354" text-anchor="middle" class="small">NVLink 5 用于 KV cache 传输</text>

  <rect x="520" y="370" width="380" height="60" class="box"/>
  <text x="710" y="392" text-anchor="middle" class="step">5 / NVLink 5 all-to-all</text>
  <text x="710" y="410" text-anchor="middle" class="small">MoE expert 通信延迟比 Hopper 低 3x</text>
  <text x="710" y="424" text-anchor="middle" class="small">MoE 密集模型获得额外乘数</text>

  <rect x="520" y="440" width="380" height="70" class="hot"/>
  <text x="710" y="462" text-anchor="middle" class="step">头条数字（2026）</text>
  <text x="710" y="480" text-anchor="middle" class="small">HGX B200：$0.02/M tok GPT-OSS-120B</text>
  <text x="710" y="496" text-anchor="middle" class="small">GB200 NVL72 + Dynamo：$0.012/M tok</text>
  <text x="710" y="510" text-anchor="middle" class="small">H100 + vLLM：$0.09/M tok</text>
</svg>
