<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .aws { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .az { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .gcp { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">托管 LLM 平台 — 三种策略</text>

  <rect x="40" y="50" width="280" height="440" class="box"/>
  <text x="180" y="72" text-anchor="middle" class="head">AWS Bedrock — marketplace</text>
  <rect x="60" y="90" width="240" height="60" class="aws"/>
  <text x="180" y="110" text-anchor="middle" class="step">Claude · Llama · Titan · Cohere</text>
  <text x="180" y="128" text-anchor="middle" class="small">Mistral · Stability · AI21</text>
  <text x="180" y="144" text-anchor="middle" class="small">一个 IAM，一个 CloudWatch 界面</text>
  <rect x="60" y="160" width="240" height="80" class="aws"/>
  <text x="180" y="182" text-anchor="middle" class="step">Application Inference Profiles</text>
  <text x="180" y="200" text-anchor="middle" class="small">最清晰的 FinOps 归因</text>
  <text x="180" y="216" text-anchor="middle" class="small">标记团队 / 产品 / 功能</text>
  <text x="180" y="232" text-anchor="middle" class="small">按 profile 计成本，无需后处理</text>
  <rect x="60" y="250" width="240" height="70" class="box"/>
  <text x="180" y="272" text-anchor="middle" class="step">TTFT P50 ≈ 75 ms</text>
  <text x="180" y="290" text-anchor="middle" class="small">按需共享容量</text>
  <text x="180" y="306" text-anchor="middle" class="small">PT 可用 $21-$50/hr</text>
  <rect x="60" y="330" width="240" height="90" class="dsk"/>
  <text x="180" y="352" text-anchor="middle" class="step">下注：可选性胜过单一模型</text>
  <text x="180" y="370" text-anchor="middle" class="small">前沿会轮换 — 保持开放</text>
  <text x="180" y="390" text-anchor="middle" class="small">多数区域支持 BAA、VPC endpoints</text>
  <text x="180" y="410" text-anchor="middle" class="small">内置 guardrails</text>

  <rect x="340" y="50" width="280" height="440" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">Azure OpenAI — 独占 + PTU</text>
  <rect x="360" y="90" width="240" height="60" class="az"/>
  <text x="480" y="110" text-anchor="middle" class="step">GPT-4 / 4o / 5 / o-series</text>
  <text x="480" y="128" text-anchor="middle" class="small">DALL-E, Whisper, fine-tuning</text>
  <text x="480" y="144" text-anchor="middle" class="small">无非 OpenAI 模型</text>
  <rect x="360" y="160" width="240" height="80" class="az"/>
  <text x="480" y="182" text-anchor="middle" class="step">Provisioned Throughput Units</text>
  <text x="480" y="200" text-anchor="middle" class="small">专用容量，按小时计费</text>
  <text x="480" y="216" text-anchor="middle" class="small">高利用率下最多省 70%</text>
  <text x="480" y="232" text-anchor="middle" class="small">盈亏平衡 ≈ 40-60% 利用率</text>
  <rect x="360" y="250" width="240" height="70" class="box"/>
  <text x="480" y="272" text-anchor="middle" class="step">TTFT P50 ≈ 50 ms（PTU）</text>
  <text x="480" y="290" text-anchor="middle" class="small">比 Bedrock 快 25 ms</text>
  <text x="480" y="306" text-anchor="middle" class="small">按需模式下差距缩小</text>
  <rect x="360" y="330" width="240" height="90" class="dsk"/>
  <text x="480" y="352" text-anchor="middle" class="step">下注：OpenAI 保持前沿</text>
  <text x="480" y="370" text-anchor="middle" class="small">受监管行业默认选择</text>
  <text x="480" y="390" text-anchor="middle" class="small">HIPAA, SOC 2, ISO 27001</text>
  <text x="480" y="410" text-anchor="middle" class="small">支持 EU 数据驻留</text>

  <rect x="640" y="50" width="280" height="440" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">Vertex AI — Gemini 优先</text>
  <rect x="660" y="90" width="240" height="60" class="gcp"/>
  <text x="780" y="110" text-anchor="middle" class="step">Gemini 2.5 Pro / Flash / Nano</text>
  <text x="780" y="128" text-anchor="middle" class="small">1M-Token 上下文窗口</text>
  <text x="780" y="144" text-anchor="middle" class="small">Model Garden 支持第三方</text>
  <rect x="660" y="160" width="240" height="80" class="gcp"/>
  <text x="780" y="182" text-anchor="middle" class="step">BigQuery 账单导出</text>
  <text x="780" y="200" text-anchor="middle" class="small">每团队一个项目 + labels</text>
  <text x="780" y="216" text-anchor="middle" class="small">对成本数据任意 SQL</text>
  <text x="780" y="232" text-anchor="middle" class="small">更多工作，更多灵活性</text>
  <rect x="660" y="250" width="240" height="70" class="box"/>
  <text x="780" y="272" text-anchor="middle" class="step">TTFT P50 ≈ 60 ms</text>
  <text x="780" y="290" text-anchor="middle" class="small">按需，共享</text>
  <text x="780" y="306" text-anchor="middle" class="small">按 SKU 预置，公开信息较少</text>
  <rect x="660" y="330" width="240" height="90" class="dsk"/>
  <text x="780" y="352" text-anchor="middle" class="step">下注：Multimodal 长上下文</text>
  <text x="780" y="370" text-anchor="middle" class="small">1M 上下文是差异点</text>
  <text x="780" y="390" text-anchor="middle" class="small">Model Garden 对冲第三方</text>
  <text x="780" y="410" text-anchor="middle" class="small">继承 GCP 合规</text>

  <rect x="40" y="500" width="880" height="50" class="box"/>
  <text x="480" y="520" text-anchor="middle" class="step">至少双 provider — Claude 来自一家，GPT 来自另一家，gateway 间 failover</text>
  <text x="480" y="540" text-anchor="middle" class="small">单 vendor 锁定是 2026 年的昂贵错误 — 前沿每月轮换</text>
</svg>
