<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .bad { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .tool { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .pattern { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM API load testing —— 两个陷阱、四种模式、五个工具</text>

  <rect x="40" y="50" width="440" height="110" class="bad"/>
  <text x="260" y="72" text-anchor="middle" class="head">GIL 陷阱（Locust 原版）</text>
  <text x="60" y="96" class="small">· client 在 Python GIL 下 Tokenizer</text>
  <text x="60" y="114" class="small">· 与请求生成竞争</text>
  <text x="60" y="132" class="small">· Tokenization backlog 抬高报告的 ITL</text>
  <text x="260" y="152" text-anchor="middle" class="caption">瓶颈是你的 client，不是 server</text>

  <rect x="500" y="50" width="420" height="110" class="bad"/>
  <text x="710" y="72" text-anchor="middle" class="head">prompt-uniformity 陷阱</text>
  <text x="520" y="96" class="small">· 单 prompt 循环 = 100% prefix cache</text>
  <text x="520" y="114" class="small">· request coalescing 将 “N concurrent” 当作 1 个处理</text>
  <text x="520" y="132" class="small">· throughput 看着很好，生产会崩</text>
  <text x="710" y="152" text-anchor="middle" class="caption">修复：LLMPerf --mean + --stddev input tokens</text>

  <rect x="40" y="180" width="440" height="160" class="tool"/>
  <text x="260" y="202" text-anchor="middle" class="head">2026 工具</text>
  <text x="60" y="226" class="step">LLMPerf —— Anyscale，Rust tokenizers，streaming</text>
  <text x="60" y="244" class="step">NVIDIA GenAI-Perf —— Triton-backed reference</text>
  <text x="60" y="262" class="step">LLM-Locust —— Locust + GIL fix</text>
  <text x="60" y="280" class="step">guidellm —— 大规模 synthetic</text>
  <text x="60" y="298" class="step">k6 v2026.1.0 + Operator 1.0 GA</text>
  <text x="60" y="316" class="small">streaming-aware、CRD-native、最佳 CI gate</text>

  <rect x="500" y="180" width="420" height="160" class="pattern"/>
  <text x="710" y="202" text-anchor="middle" class="head">四种 load patterns</text>
  <text x="520" y="226" class="step">steady —— 30-60 分钟恒定 RPS</text>
  <text x="520" y="244" class="small">捕捉基线回归</text>
  <text x="520" y="264" class="step">ramp —— 15 分钟从 0 到目标</text>
  <text x="520" y="280" class="small">捕捉容量断点 + warm-up</text>
  <text x="520" y="300" class="step">spike —— 3-10x 突发流量</text>
  <text x="520" y="316" class="small">捕捉 autoscaling + cold-start 影响</text>
  <text x="520" y="328" class="step">soak —— 4-8h 稳态</text>

  <rect x="40" y="360" width="880" height="130" class="box"/>
  <text x="480" y="382" text-anchor="middle" class="head">CI gate 配方</text>
  <text x="480" y="406" text-anchor="middle" class="step">PR 上跑 k6，基线 RPS 下 30-50 次迭代</text>
  <text x="480" y="426" text-anchor="middle" class="step">gate：P50 / P95 TTFT，5xx &lt; 5%，TPOT 阈值</text>
  <text x="480" y="446" text-anchor="middle" class="caption">违规则 break build —— 将性能视为编译错误</text>
  <text x="480" y="468" text-anchor="middle" class="small">GenAI-Perf ITL 排除 TTFT · LLMPerf 包含它 —— 同一 server，不同 TPOT</text>
</svg>
