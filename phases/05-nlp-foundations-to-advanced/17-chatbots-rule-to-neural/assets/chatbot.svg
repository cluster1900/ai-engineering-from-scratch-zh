<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .stage { font-size: 11px; fill: #c0392b; font-style: italic; text-anchor: middle; }
      .note { font-size: 10px; fill: #666; font-style: italic; }
      .line { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect class="box" x="20" y="30" width="200" height="300" rx="4"/>
  <text class="label" x="120" y="55" text-anchor="middle">基于规则</text>
  <text class="note" x="35" y="78">20 世纪 60 年代 → 如今用于安全关键场景</text>
  <text class="content" x="35" y="105">IF 匹配 "i want"</text>
  <text class="content" x="35" y="125">THEN "你为什么想要"</text>
  <text class="content" x="35" y="165">意图 classifier</text>
  <text class="content" x="35" y="183">+ slot filling</text>
  <text class="content" x="35" y="201">+ 状态机</text>
  <text class="note" x="35" y="235">优：可预测，</text>
  <text class="note" x="35" y="250">确定性，</text>
  <text class="note" x="35" y="265">无幻觉</text>
  <text class="note" x="35" y="290">缺：范围窄</text>
  <text class="note" x="35" y="305">无法处理新输入</text>

  <rect class="box" x="240" y="30" width="200" height="300" rx="4"/>
  <text class="label" x="340" y="55" text-anchor="middle">基于检索</text>
  <text class="note" x="255" y="78">2010 年代，FAQ 仍在用</text>
  <text class="content" x="255" y="105">编码话语，</text>
  <text class="content" x="255" y="123">找最近匹配，</text>
  <text class="content" x="255" y="141">返回存储回复</text>
  <text class="content" x="255" y="180">拒答阈值</text>
  <text class="note" x="255" y="220">优：处理改写，</text>
  <text class="note" x="255" y="235">无幻觉，</text>
  <text class="note" x="255" y="250">低成本扩展</text>
  <text class="note" x="255" y="280">缺：不能组合信息，</text>
  <text class="note" x="255" y="295">不能多轮</text>
  <text class="note" x="255" y="310">推理</text>

  <rect class="box" x="460" y="30" width="200" height="300" rx="4"/>
  <text class="label" x="560" y="55" text-anchor="middle">Neural Network (seq2seq)</text>
  <text class="note" x="475" y="78">2014-2019，如今少单独用</text>
  <text class="content" x="475" y="105">基于 encoder-decoder</text>
  <text class="content" x="475" y="123">对话日志</text>
  <text class="content" x="475" y="141">从零生成</text>
  <text class="note" x="475" y="180">优：表达流畅</text>
  <text class="note" x="475" y="220">缺：输出泛泛</text>
  <text class="note" x="475" y="235">（"我不知道"），</text>
  <text class="note" x="475" y="250">事实漂移，无 grounding，</text>
  <text class="note" x="475" y="265">无工具使用</text>
  <text class="note" x="475" y="290">如今用于混合系统，</text>
  <text class="note" x="475" y="305">非单独使用</text>

  <rect class="hot" x="680" y="30" width="200" height="300" rx="4"/>
  <text class="label" x="780" y="55" text-anchor="middle">LLM Agent 循环</text>
  <text class="note" x="695" y="78">2023 → 2026 生产</text>
  <text class="content" x="695" y="105">计划 → 调用工具</text>
  <text class="content" x="695" y="123">→ 观察 → 决策</text>
  <text class="content" x="695" y="141">→ ... → 回答</text>
  <text class="content" x="695" y="175">RAG grounding</text>
  <text class="content" x="695" y="195">工具契约</text>
  <text class="content" x="695" y="215">eval + 可观测性</text>
  <text class="note" x="695" y="245">优：能执行动作，</text>
  <text class="note" x="695" y="260">处理新情况</text>
  <text class="note" x="695" y="290">缺：更难推理，</text>
  <text class="note" x="695" y="305">prompt injection，</text>
  <text class="note" x="695" y="320">无限循环</text>
</svg>
