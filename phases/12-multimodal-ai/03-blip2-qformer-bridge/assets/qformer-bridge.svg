<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .frozen { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .train { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">BLIP-2 Q-Former 桥接 — 32 个 queries 压缩 ViT 供冻结 LLM 使用</text>

  <rect x="40" y="60" width="180" height="200" class="frozen"/>
  <text x="130" y="82" text-anchor="middle" class="head">冻结 ViT</text>
  <text x="130" y="102" text-anchor="middle" class="small">ViT-g/14, 1.1B</text>
  <text x="130" y="120" text-anchor="middle" class="small">224x224 输入</text>
  <text x="130" y="138" text-anchor="middle" class="small">16x16 patch 网格</text>
  <text x="130" y="156" text-anchor="middle" class="small">-&gt; 256 个 patch Tokens</text>
  <text x="130" y="174" text-anchor="middle" class="small">dim 1408</text>
  <text x="130" y="202" text-anchor="middle" class="caption">未训练</text>
  <text x="130" y="220" text-anchor="middle" class="caption">输出冻结特征</text>
  <text x="130" y="240" text-anchor="middle" class="caption">每图 256 x 1408</text>

  <path d="M 225 160 L 290 160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="258" y="150" text-anchor="middle" class="small">K, V</text>

  <rect x="295" y="60" width="250" height="300" class="train"/>
  <text x="420" y="82" text-anchor="middle" class="head">Q-Former（已训练）</text>
  <text x="420" y="100" text-anchor="middle" class="small">12 层，BERT-base 初始化</text>

  <rect x="315" y="110" width="210" height="60" class="cool"/>
  <text x="420" y="128" text-anchor="middle" class="step">32 个可学习 queries</text>
  <text x="420" y="146" text-anchor="middle" class="small">桥接参数</text>
  <text x="420" y="162" text-anchor="middle" class="small">每张图共用相同 32 个 Vectors</text>

  <rect x="315" y="178" width="210" height="60" class="box"/>
  <text x="420" y="196" text-anchor="middle" class="step">Self-Attention（仅 queries）</text>
  <text x="420" y="214" text-anchor="middle" class="small">queries 彼此交互</text>
  <text x="420" y="230" text-anchor="middle" class="small">并在阶段 1 与文本交互</text>

  <rect x="315" y="244" width="210" height="60" class="box"/>
  <text x="420" y="262" text-anchor="middle" class="step">cross-attention</text>
  <text x="420" y="280" text-anchor="middle" class="small">Q 来自 queries，K/V 来自 patches</text>
  <text x="420" y="296" text-anchor="middle" class="small">32 x 256 Attention map</text>

  <rect x="315" y="312" width="210" height="40" class="box"/>
  <text x="420" y="338" text-anchor="middle" class="step">FFN + LN（与文本路径共享）</text>

  <path d="M 550 160 L 620 160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="150" text-anchor="middle" class="small">32 个 Tokens</text>

  <rect x="625" y="60" width="140" height="120" class="train"/>
  <text x="695" y="82" text-anchor="middle" class="head">线性投影</text>
  <text x="695" y="100" text-anchor="middle" class="small">768 -&gt; 4096 (LLM dim)</text>
  <text x="695" y="118" text-anchor="middle" class="small">阶段 2 训练</text>
  <text x="695" y="138" text-anchor="middle" class="small">~3M params</text>
  <text x="695" y="158" text-anchor="middle" class="small">32 x LLM_dim 输出</text>

  <path d="M 770 120 L 830 120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="835" y="60" width="100" height="240" class="frozen"/>
  <text x="885" y="82" text-anchor="middle" class="head">冻结 LLM</text>
  <text x="885" y="102" text-anchor="middle" class="small">OPT-6.7B 或</text>
  <text x="885" y="120" text-anchor="middle" class="small">Flan-T5-XXL</text>
  <text x="885" y="148" text-anchor="middle" class="small">32 个视觉 Tokens</text>
  <text x="885" y="164" text-anchor="middle" class="small">+ 文本 prompt</text>
  <text x="885" y="182" text-anchor="middle" class="small">-&gt; caption / VQA</text>
  <text x="885" y="212" text-anchor="middle" class="caption">未训练</text>
  <text x="885" y="230" text-anchor="middle" class="caption">LM 生成</text>
  <text x="885" y="248" text-anchor="middle" class="caption">caption 或答案</text>

  <rect x="40" y="380" width="880" height="130" class="box"/>
  <text x="480" y="402" text-anchor="middle" class="head">两阶段训练</text>

  <rect x="60" y="420" width="415" height="75" class="cool"/>
  <text x="80" y="440" class="step">阶段 1：表征（无 LLM）</text>
  <text x="80" y="458" class="small">单独训练 Q-Former，使用</text>
  <text x="80" y="474" class="small">ITC（图文对比）</text>
  <text x="80" y="488" class="small">+ ITM（图文匹配）</text>
  <text x="250" y="458" class="small">+ ITG（图像 grounded 文本生成）</text>
  <text x="250" y="474" class="small">queries 学习编码</text>
  <text x="250" y="488" class="small">语义和可文本解码信息</text>

  <rect x="490" y="420" width="415" height="75" class="train"/>
  <text x="510" y="440" class="step">阶段 2：生成式（冻结 LLM）</text>
  <text x="510" y="458" class="small">投影 32 个 queries -&gt; LLM dim</text>
  <text x="510" y="474" class="small">前置到文本</text>
  <text x="510" y="488" class="small">端到端训练 LM loss</text>
  <text x="680" y="458" class="small">桥接 + projector 学习</text>
  <text x="680" y="474" class="small">干净输入 LLM</text>
  <text x="680" y="488" class="small">总计 188M params</text>
</svg>
