<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">MIO — 四种模态，一个共享词表，流式解码</text>

  <rect x="30" y="50" width="900" height="220" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">四个 Tokenizer，一个 vocab，一个 Transformer</text>

  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="180" height="70" class="hot"/>
    <text x="90" y="22" text-anchor="middle" class="step">文本</text>
    <text x="90" y="42" text-anchor="middle" class="small">BPE Tokenizer</text>
    <text x="90" y="58" text-anchor="middle" class="small">ids 0..31999</text>

    <rect x="210" y="0" width="180" height="70" class="cool"/>
    <text x="300" y="22" text-anchor="middle" class="step">图像</text>
    <text x="300" y="42" text-anchor="middle" class="small">SEED-Tokenizer</text>
    <text x="300" y="58" text-anchor="middle" class="small">ids 32000..36095</text>

    <rect x="420" y="0" width="180" height="70" class="cold"/>
    <text x="510" y="22" text-anchor="middle" class="step">语音</text>
    <text x="510" y="42" text-anchor="middle" class="small">SpeechTokenizer RVQ</text>
    <text x="510" y="58" text-anchor="middle" class="small">8 个 codebook 层</text>

    <rect x="630" y="0" width="180" height="70" class="reg"/>
    <text x="720" y="22" text-anchor="middle" class="step">音乐</text>
    <text x="720" y="42" text-anchor="middle" class="small">Encodec-class</text>
    <text x="720" y="58" text-anchor="middle" class="small">8192 个条目</text>
  </g>

  <path d="M 150 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 360 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 570 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 780 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="200" width="280" height="60" class="box"/>
  <text x="480" y="222" text-anchor="middle" class="step">一个 Transformer，一个 NTP Loss</text>
  <text x="480" y="240" text-anchor="middle" class="small">~48k 词表，文本 + 图像 + 语音 + 音乐</text>
  <text x="480" y="256" text-anchor="middle" class="small">流式友好：Token 输入，Token 输出</text>

  <rect x="30" y="290" width="900" height="220" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">四阶段课程 + 流式解码路径</text>

  <rect x="60" y="330" width="180" height="170" class="hot"/>
  <text x="150" y="352" text-anchor="middle" class="step">阶段 1 对齐</text>
  <text x="150" y="370" text-anchor="middle" class="small">文本-图像对</text>
  <text x="150" y="386" text-anchor="middle" class="small">文本-语音对</text>
  <text x="150" y="402" text-anchor="middle" class="small">文本-音乐对</text>
  <text x="150" y="428" text-anchor="middle" class="step">阶段 2 交错</text>
  <text x="150" y="446" text-anchor="middle" class="small">Multimodal 文档</text>
  <text x="150" y="462" text-anchor="middle" class="small">跨模态上下文</text>
  <text x="150" y="480" text-anchor="middle" class="small">OBELICS + podcast</text>

  <rect x="260" y="330" width="180" height="170" class="cool"/>
  <text x="350" y="352" text-anchor="middle" class="step">阶段 3 语音增强</text>
  <text x="350" y="370" text-anchor="middle" class="small">额外音频数据</text>
  <text x="350" y="386" text-anchor="middle" class="small">语音质量提升</text>
  <text x="350" y="402" text-anchor="middle" class="small">无文本退化</text>
  <text x="350" y="428" text-anchor="middle" class="step">阶段 4 SFT</text>
  <text x="350" y="446" text-anchor="middle" class="small">VQA、旁白</text>
  <text x="350" y="462" text-anchor="middle" class="small">语音对话</text>
  <text x="350" y="480" text-anchor="middle" class="small">any-to-any 任务</text>

  <rect x="460" y="330" width="460" height="170" class="reg"/>
  <text x="690" y="352" text-anchor="middle" class="step">流式解码路径（目标 &lt;500 ms TTFAB）</text>
  <text x="690" y="372" text-anchor="middle" class="small">mic -&gt; 语音 Token（~40 ms）</text>
  <text x="690" y="388" text-anchor="middle" class="small">prefill prompt（8B 时 ~80 ms）</text>
  <text x="690" y="404" text-anchor="middle" class="small">首个输出 Token（~40 ms）</text>
  <text x="690" y="420" text-anchor="middle" class="small">residual-VQ 层 1..7 并行解码（~30 ms）</text>
  <text x="690" y="436" text-anchor="middle" class="small">语音 waveform decoder（~80 ms）</text>
  <text x="690" y="462" text-anchor="middle" class="step">总 TTFAB：~270 ms（GPT-4o-class）</text>
  <text x="690" y="482" text-anchor="middle" class="caption">Moshi 160 ms，MIO 公开 traces 中 400-500 ms</text>
</svg>
