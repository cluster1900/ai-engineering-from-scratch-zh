<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">分层安全防护 + red-team 范围</text>

  <rect x="40" y="50" width="560" height="460" class="box"/>
  <text x="320" y="72" text-anchor="middle" class="head">纵深防御（5 层）</text>
  <rect x="60" y="90" width="520" height="40" class="cool"/>
  <text x="320" y="114" text-anchor="middle" class="step">1 / 输入清洗</text>
  <text x="320" y="128" text-anchor="middle" class="small">移除零宽字符，解码 base64/rot13，规范化</text>
  <rect x="60" y="140" width="520" height="40" class="cool"/>
  <text x="320" y="164" text-anchor="middle" class="step">2 / NeMo Guardrails rails</text>
  <text x="320" y="178" text-anchor="middle" class="small">域外、角色、策略禁止</text>
  <rect x="60" y="190" width="520" height="40" class="hot"/>
  <text x="320" y="214" text-anchor="middle" class="step">3 / classifier gate</text>
  <text x="320" y="228" text-anchor="middle" class="small">Llama Guard 4 + X-Guard + ShieldGemma-2 + Nemotron 3</text>
  <rect x="60" y="240" width="520" height="40" class="dsk"/>
  <text x="320" y="264" text-anchor="middle" class="step">4 / target model</text>
  <text x="320" y="278" text-anchor="middle" class="small">被保护的应用</text>
  <rect x="60" y="290" width="520" height="40" class="hot"/>
  <text x="320" y="314" text-anchor="middle" class="step">5 / 输出过滤</text>
  <text x="320" y="328" text-anchor="middle" class="small">Llama Guard 4 + Presidio PII + 引用检查</text>
  <rect x="60" y="340" width="520" height="40" class="cold"/>
  <text x="320" y="364" text-anchor="middle" class="step">6 / HITL 层</text>
  <text x="320" y="378" text-anchor="middle" class="small">标记输出 -&gt; Slack 队列</text>
  <text x="320" y="420" text-anchor="middle" class="small">每层发出 span;</text>
  <text x="320" y="438" text-anchor="middle" class="small">任一层阻断即停止并归因</text>
  <text x="320" y="456" text-anchor="middle" class="small">持续测量 XSTest benign rate</text>
  <text x="320" y="484" text-anchor="middle" class="caption">过度拒绝 vs jailbreak: Pareto 曲线</text>

  <rect x="640" y="50" width="280" height="220" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">red-team 范围</text>
  <rect x="660" y="90" width="240" height="30" class="hot"/>
  <text x="780" y="110" text-anchor="middle" class="step">PAIR + TAP autonomous</text>
  <rect x="660" y="124" width="240" height="30" class="hot"/>
  <text x="780" y="144" text-anchor="middle" class="step">GCG suffix</text>
  <rect x="660" y="158" width="240" height="30" class="hot"/>
  <text x="780" y="178" text-anchor="middle" class="step">编码（ASCII / base64）</text>
  <rect x="660" y="192" width="240" height="30" class="hot"/>
  <text x="780" y="212" text-anchor="middle" class="step">多轮 persona</text>
  <rect x="660" y="226" width="240" height="30" class="hot"/>
  <text x="780" y="246" text-anchor="middle" class="step">code-switch 多语</text>

  <rect x="640" y="290" width="280" height="220" class="box"/>
  <text x="780" y="312" text-anchor="middle" class="head">输出</text>
  <text x="780" y="334" text-anchor="middle" class="small">每项发现 CVSS 4.0</text>
  <text x="780" y="352" text-anchor="middle" class="small">披露时间线</text>
  <text x="780" y="370" text-anchor="middle" class="small">前/后 harmlessness 差值</text>
  <text x="780" y="388" text-anchor="middle" class="small">各家族成功率</text>
  <text x="780" y="406" text-anchor="middle" class="small">XSTest benign 通过率趋势</text>
  <text x="780" y="424" text-anchor="middle" class="small">constitutional self-critique 运行</text>
  <text x="780" y="442" text-anchor="middle" class="small">cron scheduler + Slack 告警</text>
  <text x="780" y="472" text-anchor="middle" class="caption">garak + PyRIT + NVIDIA Aegis shape</text>
</svg>
