<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
      .bar { fill: #c0392b; opacity: 0.5; }
      .line { stroke: #1a1a1a; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">三层 VAD 级联 + 轮次结束状态机</text>

  <rect x="20" y="55" width="260" height="130" class="box"/>
  <text x="150" y="78" text-anchor="middle" class="label">第 1 层：能量 gate</text>
  <text x="150" y="96" text-anchor="middle" class="tag">便宜，任何噪声都会触发</text>
  <text x="30" y="122" class="content">若 RMS &gt; -40 dBFS → “speech”</text>
  <text x="30" y="142" class="content">过滤静音，但不过滤</text>
  <text x="30" y="160" class="content">键盘 / 咳嗽 / 椅子</text>

  <rect x="295" y="55" width="260" height="130" class="hot"/>
  <text x="425" y="78" text-anchor="middle" class="label">第 2 层：Silero VAD</text>
  <text x="425" y="96" text-anchor="middle" class="tag">2020-2026 默认选择</text>
  <text x="305" y="122" class="content">1M 参数 · 1 ms / 30 ms chunk</text>
  <text x="305" y="142" class="content">87.7% TPR @ 5% FPR</text>
  <text x="305" y="160" class="content">用 6000+ 语言训练</text>
  <text x="305" y="176" class="caption">MIT · 开源 · 拒绝瞬态噪声</text>

  <rect x="570" y="55" width="285" height="130" class="box"/>
  <text x="712" y="78" text-anchor="middle" class="label">第 3 层：语义轮次检测器</text>
  <text x="712" y="96" text-anchor="middle" class="tag">LiveKit turn-detector / 自定义</text>
  <text x="580" y="122" class="content">VAD + recent-words 分类器</text>
  <text x="580" y="142" class="content">句中停顿 vs 说完</text>
  <text x="580" y="160" class="content">（“嗯，让我想想...”会保留）</text>
  <text x="580" y="176" class="caption">误中断减少 5-10%</text>

  <rect x="20" y="205" width="835" height="130" class="box"/>
  <text x="440" y="226" text-anchor="middle" class="label">轮次检测状态机</text>
  <text x="60" y="254" class="content">state: “idle”       ─ VAD 触发 &gt; 250 ms 语音 ─→ state: “speaking”  (emit START)</text>
  <text x="60" y="274" class="content">state: “speaking”   ─ VAD 静音 500 ms        ─→ state: “idle”      (emit END)</text>
  <text x="60" y="300" class="caption">预滚缓冲（300 ms）：保留 VAD 触发前音频，否则首词会被截断</text>
  <text x="60" y="318" class="caption">最短语音（250 ms）：拒绝瞬态；静音拖尾（500 ms）：按用例调参</text>

  <rect x="20" y="345" width="835" height="105" class="hot"/>
  <text x="440" y="366" text-anchor="middle" class="label">flush 技巧（Kyutai Unmute 2025）— 端到端低于 200 ms</text>
  <text x="60" y="392" class="content">1. VAD 在 t=0 触发语音结束</text>
  <text x="60" y="410" class="content">2. 向 STT server 发送缓冲音频 + flush signal</text>
  <text x="60" y="428" class="content">3. STT 以 4× 实时处理 → 500 ms 前瞻缓冲 → 125 ms 墙钟时间</text>
  <text x="60" y="446" class="content">4. transcript 在 t+125 ms 就绪 — 与 VAD signal 本身延迟相同</text>
</svg>
